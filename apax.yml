# General information
name: "@simatic-ax/mp-conveyorbelt"
version: 1.0.0
author: Siemens AG
# Description will be displayed in the apax extension
description: This package contains all of the mp-specialized conveyor belt data
type: lib
#URL to the repository
repository:
  type: git
  url: https://github.com/simatic-ax/mp-conveyorbelt
# Environment variables
variables:
  APAX_BUILD_ARGS:
    - '--debug'
targets:
  - '1500'
  - 'llvm'

# Registry information, where the package will be published
registries:
  '@simatic-ax': 'https://npm.pkg.github.com/'

installStrategy: strict
apaxVersion: 3.5.0

catalogs:
  "@ax/simatic-ax": ^2504.0.0

# Dependencies
devDependencies:
  '@ax/sdk': ^2504.0.0
  "@simatic-ax/snippetscollection": ^1.1.0
  "@simatic-ax/plcopen-snippets": ^1.0.1

dependencies:
  "@ax/system-timer": ^10.0.24
  "@simatic-ax/simple-control-modules": ^8.0.0
  "@simatic-ax/generators": ^8.0.0
  "@ax/simatic-1500-clocks": ^10.0.6
  "@ax/system-math": ^10.0.24
  "@simatic-ax/dynamics": ^3.0.0

files:
  - 'README.md'
  - 'LICENSE.md'
  - 'docs'
  - 'src'
  - 'snippets'
